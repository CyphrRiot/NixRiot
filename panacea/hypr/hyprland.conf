##############################################################################
# Fallback config, for a Hyprland that cannot read hyprland.lua.
#
# The real Panacea config lives in hyprland.lua and the lua/ modules. A
# Hyprland that understands Lua picks that up on its own and never reads this
# file. It exists so that an older build does not come up bare: no key
# bindings, no pill, and no way to open a terminal.
#
# So there is deliberately no parity with lua/ here: repeating two hundred lines
# in two places means having two different configs a month later, one of which
# lies. Only what is needed to work is here: the shell, windows, workspaces,
# sound. Everything else is in lua/, and the right answer to "something is
# missing" is to update Hyprland, not to write it here.
##############################################################################

$mainMod = SUPER
$terminal = footclient
$shell = $HOME/.config/panacea/scripts/start.sh
$pill = qs -c $HOME/.config/panacea ipc call pill

exec-once = $shell
exec-once = hyprpaper
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = udiskie --no-notify --no-tray
exec-once = hyprsunset

# ------------------------------------------------------------------ the pill
bind = $mainMod, A, exec, $pill launcher
bind = $mainMod, G, exec, $pill launchpad
bind = $mainMod, Tab, exec, $pill overview
bind = $mainMod, Z, exec, $pill controls
bind = $mainMod, I, exec, $pill settings
bind = $mainMod, slash, exec, $pill shortcuts
bind = $mainMod SHIFT, W, exec, $pill wifi
bind = $mainMod SHIFT, B, exec, $pill bluetooth
bind = $mainMod, V, exec, $pill clipboard
bind = CTRL ALT, Delete, exec, $pill powermenu
bind = $mainMod SHIFT, N, exec, $pill notifications
bind = $mainMod, P, exec, $pill record
bind = $mainMod SHIFT, P, exec, $pill passwords
bind = $mainMod, E, exec, $pill files
bind = $mainMod SHIFT, T, exec, $pill theme
bind = , code:108, exec, $HOME/.config/panacea/scripts/voxtype.sh start
bindr = , code:108, exec, $HOME/.config/panacea/scripts/voxtype.sh stop


# ------------------------------------------------------------- applications
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, F, exec, firefox

# ------------------------------------------------------------------- windows
bind = $mainMod, Q, exec, $HOME/.config/panacea/scripts/smart_close.sh
bind = $mainMod SHIFT, F, fullscreen
bind = $mainMod, W, togglefloating
bind = $mainMod, L, exec, $HOME/.config/panacea/scripts/lock.sh
bind = $mainMod SHIFT, M, exit
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------------------------------------------------- workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# ------------------------------------------------------- volume, brightness
# Through the same scripts as the main config: the step grows while a key is
# held, and the pill shows the level itself.
bindel = , XF86AudioRaiseVolume, exec, $HOME/.local/bin/smart_volume.sh up
bindel = , XF86AudioLowerVolume, exec, $HOME/.local/bin/smart_volume.sh down
bindl  = , XF86AudioMute,        exec, $HOME/.local/bin/smart_volume.sh mute
bindel = , XF86MonBrightnessUp,   exec, $HOME/.local/bin/smart_brightness.sh up
bindel = , XF86MonBrightnessDown, exec, $HOME/.local/bin/smart_brightness.sh down
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ------------------------------------------------------------------- look
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    layout = dwindle
}

decoration {
    rounding = 12
    blur {
        enabled = true
        size = 6
        passes = 2
    }
}

input {
    kb_layout = us
    kb_options = grp:alt_shift_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Generated from Panacea settings; personal overrides below still take precedence.
source = ~/.config/hypr/input_data.conf

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ==============================================================================
# Custom user configs
# Any file in ~/.config/hypr/custom/ overrides the defaults and is kept across
# system updates.
# ==============================================================================
source = ~/.config/hypr/custom/env.conf
source = ~/.config/hypr/custom/execs.conf
source = ~/.config/hypr/custom/general.conf
source = ~/.config/hypr/custom/rules.conf
source = ~/.config/hypr/custom/keybinds.conf
source = ~/.config/hypr/custom/user.conf
source = ~/.config/hypr/custom/custom.conf
