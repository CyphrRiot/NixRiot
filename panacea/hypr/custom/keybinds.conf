# ==============================================================================
# Custom Keybindings & Shortcuts
# ==============================================================================
# $mainMod is SUPER (Mod4)
#
# NixRiot: restore OpenRiot's common shortcuts on top of Panacea's keymap.
# OpenRiot used the same $mod (SUPER) with a different map. These rebind the
# common actions to OpenRiot's keys. Panacea's own keys stay where they do not
# conflict (SUPER+Return terminal, SUPER+V clipboard, CTRL+ALT+Delete power).

# Launcher (OpenRiot: SUPER+D; Panacea: SUPER+A)
bind = SUPER, D, exec, qs -c $HOME/.config/panacea ipc call pill launcher

# Browser (OpenRiot: SUPER+B; Panacea: SUPER+F)
bind = SUPER, B, exec, firefox

# File manager (OpenRiot: SUPER+F opened Thunar)
bind = SUPER, F, exec, thunar

# Process viewer (OpenRiot: SUPER+T ran btop in a terminal)
bind = SUPER, T, exec, foot -e btop

# Text editor (OpenRiot: SUPER+O)
bind = SUPER, O, exec, gnome-text-editor

# Crush (OpenRiot: SUPER+C)
bind = SUPER, C, exec, foot -e crush

# Music player (OpenRiot: SUPER+Shift+K)
bind = SUPER SHIFT, K, exec, lollypop

# Proton Mail (OpenRiot: SUPER+E, which Panacea already uses for its Files view)
bind = SUPER, M, exec, firefox https://mail.proton.me/inbox
bind = , XF86Mail, exec, firefox https://mail.proton.me/inbox

# X, formerly Twitter (OpenRiot: SUPER+X)
bind = SUPER, X, exec, firefox https://x.com/
bind = SUPER SHIFT, X, exec, firefox --new-window https://x.com/compose/post

# Clipboard history (OpenRiot: SUPER+Shift+V; Panacea: SUPER+V)
bind = SUPER SHIFT, V, exec, qs -c $HOME/.config/panacea ipc call pill clipboard

# Power menu (OpenRiot: SUPER+Escape; Panacea: CTRL+ALT+Delete)
bind = SUPER, Escape, exec, qs -c $HOME/.config/panacea ipc call pill powermenu

# Region screenshot (OpenRiot: SUPER+Shift+S and Print; Panacea: SUPER+Shift+S)
bind = SUPER SHIFT, S, exec, $HOME/.config/panacea/scripts/shot.sh
bind = , Print, exec, $HOME/.config/panacea/scripts/shot.sh
