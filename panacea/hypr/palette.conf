# The single system palette, "Fav".
#
# Colours used to travel with the wallpaper: every theme carried its own
# accent/bg/fg, and changing the picture recoloured terminals, waybar, btop and
# editors. Now the palette is one and lives here, and themes change only the
# wallpaper.
#
# Edited by hand; to lay the colours out across applications, run
# ~/.config/hypr/scripts/palette.sh once.

$accent_color = #c65a47
$bg_color = #1b2b34
$fg_color = #e5d1c5

# The terminal background may be darker than the rest: if the line is absent,
# $bg_color is used.
$term_bg = #000000
