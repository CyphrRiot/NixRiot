# Fallback display config, for Hyprland without Lua. The active path takes its
# settings from lua/monitors.lua, which in turn reads lua/monitors_data.lua,
# which the Display panel builds from settings.json. Here is only a general
# default: any attached monitor in its preferred mode, scale 1.0.
#
# Set your own resolution, refresh rate and scale in the settings
# (Super+I -> Display); they survive updates. Edits right here are kept too:
# the file is in KEEP.
monitor=,preferred,auto,1.0
