general {
    lock_cmd = $HOME/.config/panacea/scripts/lock.sh
    before_sleep_cmd = $HOME/.config/panacea/scripts/lock.sh
    after_sleep_cmd = $HOME/.config/panacea/scripts/nightlight.sh reapply
    ignore_dbus_inhibit = false
}

listener {
    timeout = 900
    on-timeout = $HOME/.config/panacea/scripts/lock.sh
}

listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 1200
    on-timeout = systemctl suspend
}
