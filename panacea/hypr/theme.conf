# Hyprland window appearance. System colours live in palette.conf; changing the
# wallpaper does not touch this file, so Hyprland does not reread the config for
# nothing.

$gaps_out = 10
$gaps_in = 5
$border_size = 1
$active_border = rgba(a04232ee) rgba(c65a47ee) 45deg
$inactive_border = rgba(1b2b34aa)
$rounding = 12
$rounding_power = 4.0
$active_opacity = 1
$inactive_opacity = 1
$shadow_enabled = false
$shadow_range = 15
$shadow_render_power = 3
$shadow_color = rgba(1a1a1aee)
$blur_enabled = true
$blur_size = 10
$blur_passes = 3
$blur_vibrancy = 1696


# Colours come from the single palette
source = ~/.config/hypr/palette.conf
