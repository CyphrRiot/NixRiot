# Terminal in the style of the dynamic island: black background, generous
# padding, no frame, no title, a thin caret. Theme colours are pulled in by
# the theme file, which switch_theme.sh rewrites.
# ~ rather than a home path: the file ships to everyone, and a hardcoded
# /home/<name> would break the include for everyone but the author.
include=~/.config/foot/theme
# The shell writes the second file, and it comes after the first: on the
# Nothing theme the terminal background has to match the widget cards, and
# the shared palette knows nothing about themes. Order matters: the one
# included later wins.
# The file is created on the first shell start; while empty it changes nothing.
include=~/.config/foot/panacea-theme

[main]
# NixOS: fish does not live at /usr/bin. Resolved from PATH.
shell=fish
font=JetBrainsMono Nerd Font:size=14
# line height left unset: the 16pt face has its own metrics, and a manual
# value had been tuned for a smaller font and squashed the lines
# generous padding, like the insets inside the pill
pad=22x18 center
selection-target=clipboard

[cursor]
# thin vertical caret instead of a heavy block
style=beam
beam-thickness=1
blink=yes
blink-rate=600

# There is nothing to draw a frame or title, and no reason to: the window is
# already rounded by Hyprland
[csd]
preferred=none

[scrollback]
lines=10000
indicator-position=none

# alpha lives in the same section as the theme colours: a separate [colors]
# is marked deprecated and complains at startup.
#
# The section applies only when the portal reports color-scheme=prefer-dark.
# With "default" foot silently stayed on its own grey 242424, so
# switch_theme.sh also sets a dark scheme in gsettings.
[colors-dark]
# Opaque, and that is not a typo.
#
# Terminal transparency is governed by the slider in the shell settings, and
# it does so with a compositor rule: foot itself only rereads its config at
# startup, so the slider would change nothing in an open window. An alpha
# here would multiply with the rule, so with the slider at one the window
# would still end up semi-transparent and "opaque" would be unreachable.
alpha=1.0

[mouse]
hide-when-typing=yes

# User overrides (font, padding, key bindings, and so on).
# Values in custom.ini win over the ones above and survive updates.
[main]
include=~/.config/foot/custom.ini
