# Jekyll Configuration for NixRiot GitHub Pages
title: NixRiot
description: >-
    NixOS + Panacea + OpenRiot

# GitHub Pages settings
remote_theme: pages-themes/midnight@v0.2.0
# GitHub Pages safe plugins only
plugins:
    - jekyll-remote-theme
    - jekyll-sitemap
    - jekyll-feed

# Site settings
url: "https://nixriot.org"
baseurl: ""
author: CyphrRiot
github_username: CyphrRiot

# Markdown settings
markdown: kramdown
highlighter: rouge
kramdown:
    input: GFM
    syntax_highlighter: rouge
    footnote_nr: 1
    entity_output: as_char
    toc_levels: 1..6
    smart_quotes: lsquo,rsquo,ldquo,rdquo
    enable_coderay: false
    parse_block_html: true
    parse_span_html: true

# Collections and defaults
defaults:
    - scope:
          path: ""
      values:
          layout: default

# Exclude files from processing
exclude:
    - Makefile
    - flake.nix
    - vendor
    - modules
    - home
    - hosts
    - iso

# Custom variables for the theme
show_downloads: false
github:
    repository_url: https://github.com/CyphrRiot/NixRiot
    repository_name: NixRiot
