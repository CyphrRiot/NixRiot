# User foot terminal settings for NixRiot.
#
# This file is kept across updates and never overwritten.
# Sections and keys here take highest priority and override foot.ini.
#
# Examples:
#
# [main]
# shell=fish
# font=JetBrainsMono Nerd Font:size=15
# pad=20x16 center
#
# [key-bindings]
# clipboard-copy=Control+Shift+c XF86Copy
# clipboard-paste=Control+Shift+v XF86Paste
